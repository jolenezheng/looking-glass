<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Looking Glass</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f5f0e8;
    --ink: #1a1814;
    --dust: rgba(245,240,232,0.08);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0906;
    cursor: none;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    width: 100vw;
    height: 100vh;
    position: fixed;
    inset: 0;
  }

  .quadrant {
    position: relative;
    overflow: hidden;
  }

  .quadrant iframe {
    position: absolute;
    top: 50%; left: 50%;
    width: 180%;
    height: 180%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    border: none;
    opacity: 0;
    transition: opacity 2s ease;
  }

  .quadrant iframe.loaded {
    opacity: 1;
  }

  .quadrant::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(10, 9, 6, 0.38);
    pointer-events: none;
    z-index: 1;
  }

  .divider-h {
    position: fixed;
    left: 0; right: 0;
    top: 50%;
    height: 1px;
    background: rgba(245,240,232,0.12);
    z-index: 10;
    transform: scaleX(0);
    transform-origin: center;
    animation: lineIn 1.8s cubic-bezier(0.16,1,0.3,1) 0.6s forwards;
  }

  .divider-v {
    position: fixed;
    top: 0; bottom: 0;
    left: 50%;
    width: 1px;
    background: rgba(245,240,232,0.12);
    z-index: 10;
    transform: scaleY(0);
    transform-origin: center;
    animation: lineInV 1.8s cubic-bezier(0.16,1,0.3,1) 0.6s forwards;
  }

  @keyframes lineIn {
    to { transform: scaleX(1); }
  }
  @keyframes lineInV {
    to { transform: scaleY(1); }
  }

  .enter-wrap {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .enter-btn {
    background: radial-gradient(ellipse at center, #1c1710 15%, rgba(10,9,6,0) 100%);
    border: none;
    border-radius: 50%;
    cursor: none;
    width: 112px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    opacity: 0;
    animation: fadeUp 1.2s ease 1.8s forwards, portalPulse 3s ease-in-out 3.2s infinite;
    transition: box-shadow 0.4s ease;
  }

  .enter-btn span {
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: white;
    text-transform: uppercase;
    transition: color 0.25s ease, text-shadow 0.25s ease;
    position: relative;
    z-index: 1;
  }

  .enter-btn::before { display: none; }

  .enter-btn:hover span {
    color: #b5d44a;
    text-shadow: 0 0 10px rgba(181,212,74,0.7), 0 0 24px rgba(181,212,74,0.4);
  }

  .enter-btn:hover {
    animation-play-state: running, paused;
    box-shadow:
      0 0 22px 8px rgba(251,191,36,0.55),
      0 0 55px 20px rgba(251,191,36,0.28),
      0 0 110px 45px rgba(251,191,36,0.10),
      inset 0 0 20px rgba(0,0,0,0.7);
  }

  @keyframes portalPulse {
    0%, 100% {
      box-shadow:
        0 0 28px 8px rgba(245,240,232,0.18),
        0 0 65px 20px rgba(245,240,232,0.09),
        0 0 130px 40px rgba(245,240,232,0.04),
        inset 0 0 28px rgba(0,0,0,0.96);
    }
    50% {
      box-shadow:
        0 0 42px 14px rgba(245,240,232,0.34),
        0 0 95px 32px rgba(245,240,232,0.17),
        0 0 180px 60px rgba(245,240,232,0.07),
        inset 0 0 28px rgba(0,0,0,0.96);
    }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .form-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
    background: rgba(10,9,6,0.72);
    backdrop-filter: blur(2px);
  }

  .form-overlay.visible {
    opacity: 1;
    pointer-events: all;
  }

  .tile-frame {
    display: inline-block;
    padding: 12px;
    background: repeating-conic-gradient(#3b82f6 0% 25%, #ffffff 0% 50%) 0 0 / 20px 20px;
    transform: translateY(16px);
    transition: transform 0.6s cubic-bezier(0.16,1,0.3,1);
  }

  .form-overlay.visible .tile-frame {
    transform: translateY(0);
  }

  .form-inner {
    background: #ffffff;
    padding: 28px 28px 16px;
    max-width: 520px;
    width: 100%;
    display: flex;
    flex-direction: column;
  }

  .form-title {
    font-family: 'Courier Prime', monospace;
    font-size: 9px;
    letter-spacing: 0.35em;
    color: rgba(26,24,20,0.25);
    text-transform: uppercase;
    margin-bottom: 16px;
    text-align: left;
  }

  .chat-log {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 8px;
    scrollbar-width: none;
  }
  .chat-log::-webkit-scrollbar { display: none; }

  .msg-joe-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--ink);
    line-height: 1.55;
  }

  .msg-user {
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: rgba(26,24,20,0.45);
    text-align: right;
    line-height: 1.6;
    padding-left: 32px;
  }

  .chat-options {
    flex-shrink: 0;
  }

  .dialog-opt:nth-child(odd)  { background: #ffffff; }
  .dialog-opt:nth-child(even) { background: #eaf2ff; }

  .dialog-opt {
    display: flex;
    align-items: center;
    width: 100%;
    background: none;
    border: none;
    border-bottom: 1px solid rgba(26,24,20,0.1);
    padding: 13px 14px;
    cursor: none;
    text-align: left;
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: rgba(26,24,20,0.45);
    transition: color 0.15s ease, background 0.15s ease, border-left 0.15s ease, padding-left 0.15s ease;
    gap: 12px;
  }

  .dialog-opt:last-child { border-bottom: none; }

  .dialog-opt:hover {
    color: var(--ink);
    background: rgba(59,130,246,0.08);
    border-left: 2px solid #3b82f6;
    padding-left: 12px;
  }

  .dialog-opt .tile-pip {
    flex-shrink: 0;
    width: 8px; height: 8px;
    background: repeating-conic-gradient(#3b82f6 0% 25%, #fff 0% 50%) 0 0 / 4px 4px;
    border: 0.5px solid rgba(59,130,246,0.4);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .dialog-opt:hover .tile-pip { opacity: 1; }

  .dialog-opt.has-input {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding-bottom: 0;
  }

  .dialog-opt.has-input .opt-top {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  .name-row {
    display: flex;
    width: 100%;
    border-top: 0.5px solid rgba(26,24,20,0.08);
  }

  .name-row input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    padding: 9px 12px;
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--ink);
  }

  .name-row input::placeholder { color: rgba(26,24,20,0.25); }

  .name-row button {
    background: none;
    border: none;
    border-left: 0.5px solid rgba(26,24,20,0.08);
    padding: 9px 14px;
    cursor: none;
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    color: rgba(26,24,20,0.35);
    transition: color 0.2s ease;
  }

  .name-row button:hover { color: var(--ink); }

  .form-close {
    position: absolute;
    top: 28px; right: 28px;
    background: none;
    border: none;
    cursor: none;
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(245,240,232,0.4);
    text-transform: uppercase;
    transition: color 0.3s ease;
  }

  .form-close:hover { color: rgba(245,240,232,0.8); }

  .thanks {
    display: none;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(20px, 3vw, 28px);
    color: var(--ink);
    letter-spacing: 0.04em;
    line-height: 1.6;
  }

  .bandcamp-player {
    position: fixed;
    bottom: -200px;
    left: 0;
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }

  .cursor {
    position: fixed;
    width: 6px; height: 6px;
    background: var(--cream);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease, opacity 0.3s ease;
    mix-blend-mode: difference;
  }

  .cursor.expand {
    transform: translate(-50%, -50%) scale(3);
    opacity: 0.5;
  }

  .shuffle-btn {
    position: fixed;
    bottom: 24px;
    left: 24px;
    z-index: 20;
    background: none;
    border: 0.5px solid rgba(245,240,232,0.25);
    cursor: none;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeUp 1.2s ease 2.2s forwards;
    transition: border-color 0.3s ease, background 0.3s ease;
  }

  .shuffle-btn:hover {
    border-color: rgba(245,240,232,0.6);
    background: rgba(245,240,232,0.06);
  }

  .shuffle-btn svg {
    width: 16px;
    height: 16px;
    opacity: 0.7;
    transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.16,1,0.3,1);
  }

  .shuffle-btn:hover svg {
    opacity: 1;
  }

  .shuffle-btn.spinning svg {
    transform: rotate(180deg);
  }

  .mute-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 20;
    background: none;
    border: 0.5px solid rgba(245,240,232,0.25);
    cursor: none;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeUp 1.2s ease 2.2s forwards;
    transition: border-color 0.3s ease, background 0.3s ease;
  }

  .mute-btn:hover {
    border-color: rgba(245,240,232,0.6);
    background: rgba(245,240,232,0.06);
  }

  .mute-btn svg {
    width: 16px;
    height: 16px;
    opacity: 0.7;
    transition: opacity 0.3s ease;
  }

  .mute-btn:hover svg { opacity: 1; }
  .mute-btn.muted svg { opacity: 0.35; }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>

<div class="grid" id="grid">
  <div class="quadrant" id="q0"></div>
  <div class="quadrant" id="q1"></div>
  <div class="quadrant" id="q2"></div>
  <div class="quadrant" id="q3"></div>
</div>

<div class="divider-h"></div>
<div class="divider-v"></div>

<button class="shuffle-btn" id="shuffle-btn" aria-label="Shuffle video" title="Shuffle">
  <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="16 3 21 3 21 8"/>
    <line x1="4" y1="20" x2="21" y2="3"/>
    <polyline points="21 16 21 21 16 21"/>
    <line x1="15" y1="15" x2="21" y2="21"/>
  </svg>
</button>

<div class="enter-wrap">
  <button class="enter-btn" id="enter-btn" aria-label="Enter">
    <span>enter</span>
  </button>
</div>

<div class="form-overlay" id="form-overlay" role="dialog" aria-label="Join the waitlist">
  <button class="form-close" id="form-close">close</button>
  <div class="tile-frame">
  <div class="form-inner">
    <div class="form-title">Looking Glass</div>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-options" id="chat-options"></div>
  </div>
  </div>
</div>

<audio id="bg-audio" loop preload="auto">
  <source src="K Wata - Looking Glass.mp3" type="audio/mpeg">
</audio>

<button class="mute-btn" id="mute-btn" aria-label="Toggle music" title="Toggle music">
  <svg id="icon-sound" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
  </svg>
  <svg id="icon-muted" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
    <line x1="23" y1="9" x2="17" y2="15"/>
    <line x1="17" y1="9" x2="23" y2="15"/>
  </svg>
</button>

<script>
  const API_BASE = '';  // set to your deployed backend URL in production

  // ── Video pool ──────────────────────────────────────────────────────────────
  // Add new filenames here as you drop more videos into the frontend folder.
  const ALL_VIDEOS = [
    'video1.mov',
    'video2.mov',
    'video3.mov',
    'video4.MP4',
    'video5.mov',
    'video6.MOV',
    'video7.MOV',
    'video8.MOV',
    'video9.MOV',
    'video10.MOV',
  ];

  // Shuffle array in place (Fisher-Yates)
  function fisherYates(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  const videoEls = [];          // videoEls[0..3] = the 4 <video> DOM elements
  let displayed = [];           // displayed[0..3] = src currently in each quadrant
  let pool = [];                // videos not currently on screen

  // Seed: first 4 go to quadrants, rest to pool
  displayed = ALL_VIDEOS.slice(0, 4);
  pool = ALL_VIDEOS.slice(4);

  const BUST = '?v=' + Date.now();

  function makeVideo(src, quadrantIndex) {
    const video = document.createElement('video');
    video.src = src + BUST;
    video.autoplay = true;
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.style.position = 'absolute';
    video.style.inset = '0';
    video.style.width = '100%';
    video.style.height = '100%';
    video.style.objectFit = 'cover';
    video.style.opacity = '0';
    video.style.transition = 'opacity 2s ease';
    video.addEventListener('canplay', () => {
      setTimeout(() => { video.style.opacity = '1'; }, quadrantIndex * 400);
    });
    // Loop fallback for files where the loop attribute misfires (e.g. renamed .MP4)
    video.addEventListener('ended', () => {
      video.currentTime = 0;
      video.play();
    });
    return video;
  }

  for (let i = 0; i < 4; i++) {
    const q = document.getElementById('q' + i);
    const video = makeVideo(displayed[i], i);
    videoEls.push(video);
    q.appendChild(video);
  }

  // ── Shuffle button ──────────────────────────────────────────────────────────
  const shuffleBtn = document.getElementById('shuffle-btn');

  shuffleBtn.addEventListener('click', () => {
    if (pool.length === 0) return;

    const quadIdx = Math.floor(Math.random() * 4);

    const incoming = pool.shift();
    const outgoing = displayed[quadIdx];

    pool.push(outgoing);
    displayed[quadIdx] = incoming;

    // Animate out → swap src → animate in
    const videoEl = videoEls[quadIdx];
    videoEl.style.transition = 'opacity 0.5s ease';
    videoEl.style.opacity = '0';

    setTimeout(() => {
      videoEl.src = incoming + BUST;
      videoEl.load();
      videoEl.play();
      videoEl.style.opacity = '1';
      // Restore slow fade-in transition after swap
      setTimeout(() => { videoEl.style.transition = 'opacity 2s ease'; }, 600);
    }, 500);

    // Spin the icon
    shuffleBtn.classList.add('spinning');
    setTimeout(() => shuffleBtn.classList.remove('spinning'), 450);
  });

  // Wire cursor expand to shuffle button
  shuffleBtn.addEventListener('mouseenter', () => cursor.classList.add('expand'));
  shuffleBtn.addEventListener('mouseleave', () => cursor.classList.remove('expand'));

  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });

  const interactives = document.querySelectorAll('button, input, a');
  interactives.forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('expand'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('expand'));
  });

  // ── Dialog tree ─────────────────────────────────────────────────────────────
  const TREE = {
    start: {
      q: 'Hello! I am so excited to meet you here!!\nHow may I address you?',
      opts: [
        { label: 'Hello! My name is:', input: true, inputType: 'text', placeholder: 'your name', stores: 'name', next: 'greeting' },
        { label: 'wheezyRhino22', stores: 'name', value: 'wheezyRhino22', next: null },
        { label: 'You first!', next: null },
        { label: 'I prefer not to identify at this time ;)', next: null },
      ],
    },
    greeting: {
      q: s => `${s.name}! I'm Joe, it's lovely to meet you :) What brings you here?`,
      opts: [
        { label: "I would like to subscribe via email when this project is ready for week 1 submissions! If I have a mix ready, I would love to participate :) If I don't have a mix, I would still like to be kept in the loop for when it's ready.", next: 'subscribe_eager' },
        { label: 'I was bored… and intrigued', next: 'bored_intrigued' },
        { label: "I came here by accident! I'd like to *poof* out of here and exit this tab via this portal:", exit: true },
      ],
    },
    subscribe_eager: {
      q: "Eek, exciting! Please leave your email and I will get back sometime, hopefully soon!!",
      opts: [
        { label: 'My email is:', input: true, inputType: 'email', placeholder: 'your email', stores: 'email', submitEmail: true, next: 'email_thanks' },
        { label: "Actually, I changed my mind. I'll subscribe in the future if I feel like it. In the meantime, I'd like to *poof* out of here, forget this all ever happened, and exit this tab via this portal:", exit: true },
      ],
    },
    bored_intrigued: {
      q: "Ok well… I'd love to have you on board. Give me one more chance to impress you ;)",
      opts: [
        { label: "You got me. You can let me know when you're ready at this email. If you don't impress me then, I will unsubscribe!", input: true, inputType: 'email', placeholder: 'your email', stores: 'email', submitEmail: true, next: 'email_thanks' },
        { label: "Hmm it's a no from me today. Wanna know why?", next: 'no_why' },
        { label: "Not today, sorry. Get me out of here through this portal and let's forget this ever happened!", exit: true },
      ],
    },
    no_why: {
      q: "Idk, shouldn't you be convincing me why I should be here? (pssst: if you really don't know, you can click ? in the bottom right corner)",
      opts: [{ label: 'Merp!', next: 'merp' }],
    },
    merp: {
      q: 'Merp',
      opts: [
        { label: 'Merp', next: 'merp' },
        { label: 'Start over', next: 'start' },
        { label: 'Exit this tab', exit: true },
      ],
    },
    email_thanks: {
      q: s => `you're in${s.name ? ', ' + s.name : ''}.\nsit tight.`,
      opts: [],
    },
  };

  const state = {};
  const chatLog     = document.getElementById('chat-log');
  const chatOptions = document.getElementById('chat-options');

  function exitTab() {
    overlay.classList.remove('visible');
    document.body.style.transition = 'opacity 1.2s ease';
    document.body.style.opacity = '0';
    setTimeout(() => window.close(), 1200);
  }

  async function submitEmail(email) {
    try {
      await fetch(`${API_BASE}/waitlist`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
    } catch (err) {
      console.error('waitlist error:', err);
    }
  }

  function appendJoe(text) {
    const msg = document.createElement('div');
    msg.className = 'msg-joe-text';
    msg.textContent = text;
    chatLog.appendChild(msg);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function appendUser(text) {
    const msg = document.createElement('div');
    msg.className = 'msg-user';
    msg.textContent = text;
    chatLog.appendChild(msg);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function goTo(nodeId) {
    const node = TREE[nodeId];
    if (!node) return;
    const qText = typeof node.q === 'function' ? node.q(state) : node.q;
    appendJoe(qText);
    showOptions(node.opts);
  }

  function showOptions(opts) {
    chatOptions.innerHTML = '';
    opts.forEach(opt => {
      chatOptions.appendChild(opt.input ? makeInputOpt(opt) : makeButtonOpt(opt));
    });
  }

  function makeButtonOpt(opt) {
    const btn = document.createElement('button');
    btn.className = 'dialog-opt';
    btn.type = 'button';

    const pip = document.createElement('span');
    pip.className = 'tile-pip';
    const label = document.createElement('span');
    label.textContent = opt.label;
    btn.appendChild(pip);
    btn.appendChild(label);

    btn.addEventListener('click', () => {
      if (opt.exit) { exitTab(); return; }
      if (opt.stores && opt.value) state[opt.stores] = opt.value;
      appendUser(opt.label);
      chatOptions.innerHTML = '';
      if (opt.next) setTimeout(() => goTo(opt.next), 320);
    });
    btn.addEventListener('mouseenter', () => cursor.classList.add('expand'));
    btn.addEventListener('mouseleave', () => cursor.classList.remove('expand'));
    return btn;
  }

  function makeInputOpt(opt) {
    const wrap = document.createElement('div');
    wrap.className = 'dialog-opt has-input';

    const top = document.createElement('div');
    top.className = 'opt-top';
    const pip = document.createElement('span');
    pip.className = 'tile-pip';
    const label = document.createElement('span');
    label.textContent = opt.label;
    top.appendChild(pip);
    top.appendChild(label);

    const row = document.createElement('div');
    row.className = 'name-row';
    const inp = document.createElement('input');
    inp.type = opt.inputType || 'text';
    inp.placeholder = opt.placeholder || '';
    inp.autocomplete = 'off';

    const go = document.createElement('button');
    go.textContent = '→';
    go.addEventListener('click', async () => {
      const val = inp.value.trim();
      if (!val) { inp.focus(); return; }
      if (opt.stores) state[opt.stores] = val;
      if (opt.submitEmail) await submitEmail(val);
      appendUser(opt.label + ' ' + val);
      chatOptions.innerHTML = '';
      if (opt.next) setTimeout(() => goTo(opt.next), 320);
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go.click(); });

    row.appendChild(inp);
    row.appendChild(go);
    wrap.appendChild(top);
    wrap.appendChild(row);
    wrap.addEventListener('mouseenter', () => cursor.classList.add('expand'));
    wrap.addEventListener('mouseleave', () => cursor.classList.remove('expand'));
    return wrap;
  }

  // ── Overlay ──────────────────────────────────────────────────────────────────
  const enterBtn = document.getElementById('enter-btn');
  const overlay  = document.getElementById('form-overlay');
  const closeBtn = document.getElementById('form-close');

  const enterWrap = document.querySelector('.enter-wrap');

  enterBtn.addEventListener('click', () => {
    const btnRect = enterBtn.getBoundingClientRect();
    const cx = btnRect.left + btnRect.width / 2;
    const cy = btnRect.top  + btnRect.height / 2;

    // Hide portal
    enterWrap.style.transition = 'opacity 0.22s ease';
    enterWrap.style.opacity = '0';
    enterWrap.style.pointerEvents = 'none';

    // White pill starts at portal position
    const pill = document.createElement('div');
    pill.style.cssText = `
      position:fixed; z-index:50; pointer-events:none;
      background:#fff;
      border-radius:50%;
      width:${btnRect.width}px; height:${btnRect.height}px;
      left:${cx - btnRect.width/2}px; top:${cy - btnRect.height/2}px;
    `;
    document.body.appendChild(pill);

    // Target: tile-frame wraps form-inner (520px wide, 360px tall) + 12px padding each side
    const TW = 544, TH = 384;
    const tx = window.innerWidth  / 2 - TW / 2;
    const ty = window.innerHeight / 2 - TH / 2;

    requestAnimationFrame(() => requestAnimationFrame(() => {
      pill.style.transition = 'all 0.55s cubic-bezier(0.16,1,0.3,1)';
      pill.style.width        = TW + 'px';
      pill.style.height       = TH + 'px';
      pill.style.left         = tx + 'px';
      pill.style.top          = ty + 'px';
      pill.style.borderRadius = '0';
    }));

    setTimeout(() => {
      chatLog.innerHTML = '';
      chatOptions.innerHTML = '';
      Object.keys(state).forEach(k => delete state[k]);
      // Show overlay instantly (pill is covering it)
      overlay.style.transition = 'none';
      overlay.classList.add('visible');
      requestAnimationFrame(() => { overlay.style.transition = ''; });
      pill.remove();
      goTo('start');
    }, 620);
  });

  function restorePortal() {
    overlay.classList.remove('visible');
    enterWrap.style.transition = 'opacity 0.4s ease';
    enterWrap.style.opacity = '1';
    enterWrap.style.pointerEvents = '';
  }

  closeBtn.addEventListener('click', restorePortal);

  overlay.addEventListener('click', e => {
    if (e.target === overlay) restorePortal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') restorePortal();
  });

  // ── Background audio ─────────────────────────────────────────────────────────
  const bgAudio  = document.getElementById('bg-audio');
  const muteBtn  = document.getElementById('mute-btn');
  const iconSound  = document.getElementById('icon-sound');
  const iconMuted  = document.getElementById('icon-muted');
  let audioStarted = false;

  function startAudio() {
    if (audioStarted) return;
    audioStarted = true;
    bgAudio.volume = 0.5;
    bgAudio.play().catch(() => {});
    document.removeEventListener('click', startAudio);
  }

  document.addEventListener('click', startAudio);

  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    startAudio();
    bgAudio.muted = !bgAudio.muted;
    muteBtn.classList.toggle('muted', bgAudio.muted);
    iconSound.style.display = bgAudio.muted ? 'none' : '';
    iconMuted.style.display = bgAudio.muted ? ''     : 'none';
  });

  muteBtn.addEventListener('mouseenter', () => cursor.classList.add('expand'));
  muteBtn.addEventListener('mouseleave', () => cursor.classList.remove('expand'));
</script>
</body>
</html>
