<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Looking Glass</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f5f0e8;
    --ink: #1a1814;
    --dust: rgba(245,240,232,0.08);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0906;
    cursor: none;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    width: 100vw;
    height: 100vh;
    position: fixed;
    inset: 0;
  }

  .quadrant {
    position: relative;
    overflow: hidden;
  }

  .quadrant iframe {
    position: absolute;
    top: 50%; left: 50%;
    width: 180%;
    height: 180%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    border: none;
    opacity: 0;
    transition: opacity 2s ease;
  }

  .quadrant iframe.loaded {
    opacity: 1;
  }

  .quadrant::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(10, 9, 6, 0.38);
    pointer-events: none;
    z-index: 1;
  }

  .divider-h {
    position: fixed;
    left: 0; right: 0;
    top: 50%;
    height: 1px;
    background: rgba(245,240,232,0.12);
    z-index: 10;
    transform: scaleX(0);
    transform-origin: center;
    animation: lineIn 1.8s cubic-bezier(0.16,1,0.3,1) 0.6s forwards;
  }

  .divider-v {
    position: fixed;
    top: 0; bottom: 0;
    left: 50%;
    width: 1px;
    background: rgba(245,240,232,0.12);
    z-index: 10;
    transform: scaleY(0);
    transform-origin: center;
    animation: lineInV 1.8s cubic-bezier(0.16,1,0.3,1) 0.6s forwards;
  }

  @keyframes lineIn {
    to { transform: scaleX(1); }
  }
  @keyframes lineInV {
    to { transform: scaleY(1); }
  }

  .enter-wrap {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .enter-btn {
    background: none;
    border: none;
    cursor: none;
    padding: 20px 32px;
    position: relative;
    opacity: 0;
    animation: fadeUp 1.2s ease 1.8s forwards;
  }

  .enter-btn span {
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--cream);
    text-transform: uppercase;
    opacity: 0.7;
    display: block;
    transition: opacity 0.3s ease;
  }

  .enter-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border: 0.5px solid rgba(245,240,232,0.25);
    transition: border-color 0.3s ease, transform 0.3s ease;
  }

  .enter-btn:hover span { opacity: 1; }
  .enter-btn:hover::before {
    border-color: rgba(245,240,232,0.6);
    transform: scale(1.04);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .form-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
    background: rgba(10,9,6,0.72);
    backdrop-filter: blur(2px);
  }

  .form-overlay.visible {
    opacity: 1;
    pointer-events: all;
  }

  .tile-frame {
    display: inline-block;
    padding: 12px;
    background: repeating-conic-gradient(#3b82f6 0% 25%, #ffffff 0% 50%) 0 0 / 20px 20px;
    transform: translateY(16px);
    transition: transform 0.6s cubic-bezier(0.16,1,0.3,1);
  }

  .form-overlay.visible .tile-frame {
    transform: translateY(0);
  }

  .form-inner {
    text-align: center;
    background: #ffffff;
    padding: 48px 40px;
    max-width: 440px;
    width: 100%;
  }

  .form-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(28px, 5vw, 42px);
    color: var(--ink);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .form-sub {
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: rgba(26,24,20,0.45);
    text-transform: uppercase;
    margin-bottom: 40px;
    line-height: 1.8;
  }

  .form-row {
    display: flex;
    gap: 0;
    border: 0.5px solid rgba(26,24,20,0.2);
    transition: border-color 0.3s ease;
  }

  .form-row:focus-within {
    border-color: rgba(26,24,20,0.5);
  }

  .form-row input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    padding: 14px 18px;
    font-family: 'Courier Prime', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--ink);
    width: 100%;
  }

  .form-row input::placeholder {
    color: rgba(26,24,20,0.3);
    letter-spacing: 0.15em;
  }

  .form-row button {
    background: none;
    border: none;
    border-left: 0.5px solid rgba(26,24,20,0.2);
    padding: 14px 20px;
    cursor: none;
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(26,24,20,0.5);
    text-transform: uppercase;
    white-space: nowrap;
    transition: color 0.3s ease, background 0.3s ease;
  }

  .form-row button:hover {
    color: var(--ink);
    background: rgba(26,24,20,0.04);
  }

  .form-note {
    margin-top: 20px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: rgba(26,24,20,0.4);
    line-height: 1.7;
  }

  .form-close {
    position: absolute;
    top: 28px; right: 28px;
    background: none;
    border: none;
    cursor: none;
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(245,240,232,0.4);
    text-transform: uppercase;
    transition: color 0.3s ease;
  }

  .form-close:hover { color: rgba(245,240,232,0.8); }

  .thanks {
    display: none;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(20px, 3vw, 28px);
    color: var(--ink);
    letter-spacing: 0.04em;
    line-height: 1.6;
  }

  .bandcamp-player {
    position: fixed;
    bottom: -200px;
    left: 0;
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }

  .cursor {
    position: fixed;
    width: 6px; height: 6px;
    background: var(--cream);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease, opacity 0.3s ease;
    mix-blend-mode: difference;
  }

  .cursor.expand {
    transform: translate(-50%, -50%) scale(3);
    opacity: 0.5;
  }

  .shuffle-btn {
    position: fixed;
    bottom: 24px;
    left: 24px;
    z-index: 20;
    background: none;
    border: 0.5px solid rgba(245,240,232,0.25);
    cursor: none;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeUp 1.2s ease 2.2s forwards;
    transition: border-color 0.3s ease, background 0.3s ease;
  }

  .shuffle-btn:hover {
    border-color: rgba(245,240,232,0.6);
    background: rgba(245,240,232,0.06);
  }

  .shuffle-btn svg {
    width: 16px;
    height: 16px;
    opacity: 0.7;
    transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.16,1,0.3,1);
  }

  .shuffle-btn:hover svg {
    opacity: 1;
  }

  .shuffle-btn.spinning svg {
    transform: rotate(180deg);
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>

<div class="grid" id="grid">
  <div class="quadrant" id="q0"></div>
  <div class="quadrant" id="q1"></div>
  <div class="quadrant" id="q2"></div>
  <div class="quadrant" id="q3"></div>
</div>

<div class="divider-h"></div>
<div class="divider-v"></div>

<button class="shuffle-btn" id="shuffle-btn" aria-label="Shuffle video" title="Shuffle">
  <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="16 3 21 3 21 8"/>
    <line x1="4" y1="20" x2="21" y2="3"/>
    <polyline points="21 16 21 21 16 21"/>
    <line x1="15" y1="15" x2="21" y2="21"/>
  </svg>
</button>

<div class="enter-wrap">
  <button class="enter-btn" id="enter-btn" aria-label="Enter">
    <span>enter</span>
  </button>
</div>

<div class="form-overlay" id="form-overlay" role="dialog" aria-label="Join the waitlist">
  <button class="form-close" id="form-close">close</button>
  <div class="tile-frame">
  <div class="form-inner">
    <div class="form-title">Looking Glass</div>
    <div class="form-sub">a mix sharing project<br>something is coming</div>
    <div class="form-row">
      <input type="email" id="email-input" placeholder="your email" autocomplete="off" />
      <button id="submit-btn" type="button">I'm in</button>
    </div>
    <p class="form-note">no spam. just a note when it's ready.</p>
    <div class="thanks" id="thanks">you're in.<br>sit tight.</div>
  </div>
  </div>
</div>

<iframe
  class="bandcamp-player"
  src="https://bandcamp.com/EmbeddedPlayer/v=2/track=486922095/size=large/tracklist=false/artwork=small/"
  seamless
  id="bc-player"
  title="Looking Glass by K Wata"
></iframe>

<script>
  const API_BASE = '';  // set to your deployed backend URL in production

  // ── Video pool ──────────────────────────────────────────────────────────────
  // Add new filenames here as you drop more videos into the frontend folder.
  const ALL_VIDEOS = [
    'video1.mov',
    'video2.mov',
    'video3.mov',
    'video4.mov',
  ];

  // Shuffle array in place (Fisher-Yates)
  function fisherYates(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  const videoEls = [];          // videoEls[0..3] = the 4 <video> DOM elements
  let displayed = [];           // displayed[0..3] = src currently in each quadrant
  let pool = [];                // videos not currently on screen

  // Seed: first 4 go to quadrants, rest to pool
  displayed = ALL_VIDEOS.slice(0, 4);
  pool = ALL_VIDEOS.slice(4);

  function makeVideo(src, quadrantIndex) {
    const video = document.createElement('video');
    video.src = src;
    video.autoplay = true;
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.style.position = 'absolute';
    video.style.inset = '0';
    video.style.width = '100%';
    video.style.height = '100%';
    video.style.objectFit = 'cover';
    video.style.opacity = '0';
    video.style.transition = 'opacity 2s ease';
    video.addEventListener('canplay', () => {
      setTimeout(() => { video.style.opacity = '1'; }, quadrantIndex * 400);
    });
    // Loop fallback for files where the loop attribute misfires (e.g. renamed .MP4)
    video.addEventListener('ended', () => {
      video.currentTime = 0;
      video.play();
    });
    return video;
  }

  for (let i = 0; i < 4; i++) {
    const q = document.getElementById('q' + i);
    const video = makeVideo(displayed[i], i);
    videoEls.push(video);
    q.appendChild(video);
  }

  // ── Shuffle button ──────────────────────────────────────────────────────────
  const shuffleBtn = document.getElementById('shuffle-btn');

  shuffleBtn.addEventListener('click', () => {
    if (pool.length === 0) return;

    const quadIdx = Math.floor(Math.random() * 4);
    const poolIdx = Math.floor(Math.random() * pool.length);

    const incoming = pool[poolIdx];
    const outgoing = displayed[quadIdx];

    // Swap in state
    pool[poolIdx] = outgoing;
    displayed[quadIdx] = incoming;

    // Animate out → swap src → animate in
    const videoEl = videoEls[quadIdx];
    videoEl.style.transition = 'opacity 0.5s ease';
    videoEl.style.opacity = '0';

    setTimeout(() => {
      videoEl.src = incoming;
      videoEl.load();
      videoEl.play();
      videoEl.style.opacity = '1';
      // Restore slow fade-in transition after swap
      setTimeout(() => { videoEl.style.transition = 'opacity 2s ease'; }, 600);
    }, 500);

    // Spin the icon
    shuffleBtn.classList.add('spinning');
    setTimeout(() => shuffleBtn.classList.remove('spinning'), 450);
  });

  // Wire cursor expand to shuffle button
  shuffleBtn.addEventListener('mouseenter', () => cursor.classList.add('expand'));
  shuffleBtn.addEventListener('mouseleave', () => cursor.classList.remove('expand'));

  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });

  const interactives = document.querySelectorAll('button, input, a');
  interactives.forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('expand'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('expand'));
  });

  const enterBtn = document.getElementById('enter-btn');
  const overlay = document.getElementById('form-overlay');
  const closeBtn = document.getElementById('form-close');
  const submitBtn = document.getElementById('submit-btn');
  const emailInput = document.getElementById('email-input');
  const thanks = document.getElementById('thanks');
  const formRow = document.querySelector('.form-row');
  const formNote = document.querySelector('.form-note');
  const formSub = document.querySelector('.form-sub');

  enterBtn.addEventListener('click', () => {
    overlay.classList.add('visible');
    setTimeout(() => emailInput.focus(), 400);
  });

  closeBtn.addEventListener('click', () => {
    overlay.classList.remove('visible');
  });

  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('visible');
  });

  submitBtn.addEventListener('click', handleSubmit);
  emailInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSubmit();
  });

  async function handleSubmit() {
    const email = emailInput.value.trim();
    if (!email || !email.includes('@')) {
      emailInput.style.borderBottom = '0.5px solid rgba(245,240,232,0.4)';
      emailInput.focus();
      return;
    }

    submitBtn.textContent = '...';
    submitBtn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/waitlist`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        // already on list — still show thanks
        if (res.status !== 409) throw new Error(data.detail || 'error');
      }
    } catch (err) {
      // fail silently for UX — the user sees thanks either way
      console.error('waitlist error:', err);
    }

    formRow.style.display = 'none';
    formNote.style.display = 'none';
    formSub.style.display = 'none';
    thanks.style.display = 'block';
    thanks.style.animation = 'fadeUp 0.8s ease forwards';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') overlay.classList.remove('visible');
  });
</script>
</body>
</html>
